<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MetroDrop</title>
	<link rel="stylesheet" href="style.css">
	<link rel="preload" as="image" href="img/backround.jpg">
	<link rel="preload" as="image" href="img/head_backround.png">
	<link rel="preload" as="image" href="img/menu_backround.png">
	<script src="supabase.js"></script>
	<script src="script.js" defer></script>
</head>
<body>
	<div class="background-overlay" aria-hidden="true"></div>

	<header class="site-header">
		<a class="brand" href="home.html" aria-label="MetroDrop - главная">
			<img class="brand-logo" src="img/logo.png" alt="MetroDrop">
		</a>

		<nav class="main-nav" id="main-menu" aria-label="Основная навигация">
			<a class="nav-link" href="#login">АВТОРИЗАЦИЯ</a>
			<a class="nav-link is-active" href="#cases">КЕЙСЫ</a>
			<a class="nav-link" href="#market">РЫНОК</a>
			<a class="nav-link" href="workbench.html">ВЕРСТАК</a>
			<a class="nav-link" href="contract.html">КОНТРАКТ</a>

			<div class="mobile-menu-panel" aria-label="Меню пользователя">
				<a class="mobile-menu-item" href="#login">АВТОРИЗАЦИЯ</a>
				<a class="mobile-menu-item" href="#cases">КЕЙСЫ</a>
				<a class="mobile-menu-item" href="workbench.html">ВЕРСТАК</a>
				<a class="mobile-menu-item" href="upgrade.html">АПГРЕЙД</a>
				<a class="mobile-menu-item" href="contract.html">КОНТРАКТ</a>
				<a class="mobile-menu-item gold-menu-item" href="#events">СОБЫТИЯ</a>
				<img class="mobile-menu-decoration" src="img/img_menu.png" alt="" aria-hidden="true">
			</div>
		</nav>

		<div class="header-actions">
			<div class="balance-card" data-balance-card role="button" tabindex="0" aria-label="Переключить валюту">
				<span class="balance" data-balance>0</span>
				<img class="balance-currency" data-balance-currency src="img/metro_money.png" alt="Метровалюты">
			</div>
			<a class="login-button" href="#login">ВОЙТИ</a>
			<button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu">
				<span class="menu-icon" aria-hidden="true">
					<span></span>
					<span></span>
					<span></span>
				</span>
				<span class="visually-hidden">Открыть меню</span>
			</button>
		</div>
	</header>

	<section class="home-promo" aria-label="Рекламные предложения">
		<div class="home-promo-track">
			<div class="home-promo-slides">
			<a class="home-promo-slide is-active" href="#events" aria-label="Открыть рекламное предложение">
				<img src="img/banner1.png" alt="Рекламное предложение">
			</a>
			</div>
		</div>
	</section>

	<main class="home-cases" id="cases" aria-label="Кейсы">
		<div id="homeCaseSections"></div>
	</main>

	<main class="auth-page" id="login">
		<section class="auth-panel" aria-labelledby="auth-title">
			<img class="auth-logo" src="img/logo.png" alt="MetroDrop">
			<div class="auth-copy">
				<h1 class="auth-title" id="auth-title">АВТОРИЗАЦИЯ</h1>
				<p>Войдите или создайте аккаунт, чтобы продолжить игру.</p>
			</div>
			<div class="auth-actions">
				<button class="auth-button" type="button" data-auth-view="login">ВХОД</button>
				<button class="auth-button gold-button" type="button" data-auth-view="registration">РЕГИСТРАЦИЯ</button>
			</div>
			<p class="auth-message" role="status" aria-live="polite"></p>

			<form class="auth-form" id="login-form" data-auth-form="login" hidden>
				<h2>ВХОД В АККАУНТ</h2>
				<label>ИМЯ ИГРОКА ИЛИ ID<input name="identifier" type="text" autocomplete="username" required></label>
				<label>ПАРОЛЬ<input name="password" type="password" autocomplete="current-password" required></label>
				<p class="form-message" role="alert" aria-live="polite"></p>
				<div class="form-actions">
					<button class="form-submit" type="submit" disabled>ВОЙТИ</button>
				</div>
				<button class="form-back" type="button" aria-label="Назад">
					<svg viewBox="0 0 512 512" aria-hidden="true" focusable="false">
						<path d="M353,450a15,15,0,0,1-10.61-4.39L157.5,260.71a15,15,0,0,1,0-21.21L342.39,54.6a15,15,0,1,1,21.22,21.21L189.32,250.1,363.61,424.39A15,15,0,0,1,353,450Z"></path>
					</svg>
				</button>
			</form>

			<form class="auth-form" id="registration-form" data-auth-form="registration" hidden>
				<h2>СОЗДАНИЕ АККАУНТА</h2>
				<label>ИМЯ ИГРОКА<input name="name" type="text" autocomplete="nickname" title="Имя игрока должно содержать хотя бы одну букву" required></label>
				<label>ID<input name="id" type="text" inputmode="numeric" pattern="[0-9]{8,11}" minlength="8" maxlength="11" required></label>
				<label>ПАРОЛЬ<input name="password" type="password" autocomplete="new-password" minlength="6" required></label>
				<p class="form-message" role="alert" aria-live="polite"></p>
				<div class="form-actions">
					<button class="form-submit" type="submit" disabled>ЗАРЕГИСТРИРОВАТЬСЯ</button>
				</div>
				<button class="form-back" type="button" aria-label="Назад">
					<svg viewBox="0 0 512 512" aria-hidden="true" focusable="false">
						<path d="M353,450a15,15,0,0,1-10.61-4.39L157.5,260.71a15,15,0,0,1,0-21.21L342.39,54.6a15,15,0,1,1,21.22,21.21L189.32,250.1,363.61,424.39A15,15,0,0,1,353,450Z"></path>
					</svg>
				</button>
			</form>
		</section>
	</main>
</body>
</html>
