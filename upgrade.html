<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Апгрейд | MetroDrop</title>
	<link rel="stylesheet" href="style.css">
	<link rel="preload" as="image" href="img/backround_upgrade.jpg">
	<link rel="preload" as="image" href="img/head_backround.png">
	<link rel="preload" as="image" href="img/menu_backround.png">
	<script src="supabase.js"></script>
	<script src="script.js" defer></script>
</head>
<body class="upgrade-body">
	<div class="background-overlay" aria-hidden="true"></div>

	<header class="site-header">
		<a class="brand" href="home.html" aria-label="MetroDrop - главная">
			<img class="brand-logo" src="img/logo.png" alt="MetroDrop">
		</a>

		<nav class="main-nav" id="main-menu" aria-label="Основная навигация">
			<a class="nav-link" href="home.html#login">АВТОРИЗАЦИЯ</a>
			<a class="nav-link" href="home.html#cases">КЕЙСЫ</a>
			<a class="nav-link" href="home.html#market">РЫНОК</a>
			<a class="nav-link" href="workbench.html">ВЕРСТАК</a>
			<a class="nav-link" href="contract.html">КОНТРАКТ</a>

			<div class="mobile-menu-panel" aria-label="Меню пользователя">
				<a class="mobile-menu-item" href="home.html#login">АВТОРИЗАЦИЯ</a>
				<a class="mobile-menu-item" href="home.html#cases">КЕЙСЫ</a>
				<a class="mobile-menu-item" href="workbench.html">ВЕРСТАК</a>
				<a class="mobile-menu-item" href="upgrade.html">АПГРЕЙД</a>
				<a class="mobile-menu-item" href="contract.html">КОНТРАКТ</a>
				<a class="mobile-menu-item gold-menu-item" href="missions.html">СОБЫТИЯ</a>
				<img class="mobile-menu-decoration" src="img/img_menu.png" alt="" aria-hidden="true">
			</div>
		</nav>

		<div class="header-actions">
			<div class="balance-card" data-balance-card role="button" tabindex="0" aria-label="Переключить валюту">
				<span class="balance" data-balance>0</span>
				<img class="balance-currency" data-balance-currency src="img/metro_money.png" alt="Метровалюты">
			</div>
			<a class="login-button" href="home.html#login">ВОЙТИ</a>
			<button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu">
				<span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
				<span class="visually-hidden">Открыть меню</span>
			</button>
		</div>
	</header>

	<main class="page-shell" aria-label="Страница апгрейда">
		<section class="upgrade-demo" aria-label="Апгрейд барабан">
			<div class="upgrade-wheel">
				<img class="upgrade-drum" src="img/upgrade_circle.png" alt="Барабан апгрейда">

				<div class="chance-circle" id="chanceCircle">
					<div class="chance-gradient"></div>
					<div class="chance-text" id="chanceText">50%</div>
				</div>

				<div class="arrow-orbit">
					<div class="arrow" id="arrow">
						<svg viewBox="0 0 44 44" width="28" height="28" aria-hidden="true" focusable="false">
							<path fill="currentColor" fill-rule="evenodd" d="M21.793 22.126a.4.4 0 0 1 .414 0l12.172 7.373a.4.4 0 0 1 .192.342v5.643a.4.4 0 0 1-.584.356L22.185 29.71a.4.4 0 0 0-.37 0L10.013 35.84a.4.4 0 0 1-.584-.356v-5.643a.4.4 0 0 1 .192-.342zm-.008-15.703a.4.4 0 0 1 .43 0L39.1 17.168a.4.4 0 0 1 .184.337v8.536a.4.4 0 0 1-.59.35l-16.504-9a.4.4 0 0 0-.382 0l-16.503 9a.4.4 0 0 1-.592-.35v-8.536a.4.4 0 0 1 .185-.337z" clip-rule="evenodd"></path>
						</svg>
					</div>
				</div>
			</div>

			<div class="upgrade-result" id="result"></div>

			<div class="chance-selector">
				<div class="chance-buttons">
					<button class="chance-btn" data-chance="30" type="button">30%</button>
					<button class="chance-btn" data-chance="40" type="button">40%</button>
					<button class="chance-btn" data-chance="75" type="button">75%</button>
					<button class="chance-btn active" data-chance="50" type="button">x2</button>
					<button class="chance-btn" data-chance="20" type="button">x5</button>
					<button class="chance-btn" data-chance="10" type="button">x10</button>
				</div>
			</div>

			<button class="upgrade-btn" id="upgradeBtn" type="button">УЛУЧШИТЬ</button>

			<div class="upgrade-cards" aria-label="Предметы апгрейда">
				<div class="upgrade-card upgrade-source-card">
					<span class="upgrade-card-label">ПРЕДМЕТ</span>
					<button class="upgrade-item-slot" id="sourceItemSlot" type="button" aria-expanded="false">
						<span class="upgrade-item-empty">ВЫБРАТЬ ИЗ ИНВЕНТАРЯ</span>
					</button>
				</div>
				<div class="upgrade-card upgrade-result-card">
					<span class="upgrade-card-label">РЕЗУЛЬТАТ</span>
					<button class="upgrade-item-slot upgrade-result-slot" id="resultItemSlot" type="button" aria-expanded="false">
						<span class="upgrade-item-empty">ВЫБРАТЬ РЕЗУЛЬТАТ</span>
					</button>
				</div>
			</div>
			<section class="inventory upgrade-inventory-picker" id="inventoryPicker" aria-label="Инвентарь" aria-hidden="true">
				<div class="inventory-header" aria-hidden="true">
					<img src="img/head_inventory.jpg" alt="">
					<span>ИНВЕНТАРЬ</span>
				</div>
				<div class="inventory-grid" id="inventoryGrid">
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
				</div>
			</section>
		</section>
	</main>

	<style>
		.page-shell {
			position: relative;
			z-index: 1;
			display: flex;
			justify-content: center;
			padding: 36px 16px 40px;
			min-height: calc(100vh - 76px);
		}

		.upgrade-demo {
			display: flex;
			flex-direction: column;
			align-items: center;
			width: min(100%, 500px);
			margin: 0 auto;
			background: transparent;
			box-shadow: none;
		}

		.upgrade-wheel {
			position: relative;
			width: 420px;
			height: 420px;
			max-width: 90vw;
			max-height: 90vw;
			margin: 0 auto;
		}

		.upgrade-drum {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: contain;
			z-index: 1;
		}

		.chance-circle {
			--chance: 50%;
			position: absolute;
			left: 50%;
			top: 50%;
			width: 250px;
			height: 250px;
			transform: translate(-50%, -50%) translateZ(0);
			border-radius: 50%;
			overflow: hidden;
			z-index: 3;
			background: transparent;
			border: 0;
			box-shadow: none;
			will-change: transform;
		}

		.chance-gradient {
			position: absolute;
			inset: 0;
			border-radius: 50%;
			background:
				linear-gradient(180deg, rgba(255, 204, 55, .62), rgba(232, 157, 25, .56) 48%, rgba(112, 75, 12, .8));
			box-shadow: inset 0 1px 0 rgba(255, 214, 72, .24), 0 0 18px rgba(255, 202, 64, .38), 0 0 30px rgba(255, 174, 0, .2);
			opacity: 0.98;
			clip-path: inset(calc(100% - var(--chance)) 0 0 0);
			transition: clip-path 0.35s ease;
			filter: saturate(1.35) brightness(1.08);
			overflow: hidden;
			animation: mission-button-flicker 4.8s ease-in-out infinite;
			will-change: clip-path, opacity, transform;
		}

		.chance-gradient::before {
			content: "";
			position: absolute;
			inset: 0;
			background: repeating-linear-gradient(to bottom, rgba(190, 222, 242, .18) 0 1px, transparent 1px 4px);
			animation: mission-button-scan 8s linear infinite;
			pointer-events: none;
		}

		.chance-gradient::after {
			display: none;
		}

		@keyframes mission-button-flicker {
			0%, 100% { opacity: .94; }
			50% { opacity: 1; }
		}

		@keyframes mission-button-scan {
			from { background-position: 0 0; }
			to { background-position: 0 20px; }
		}

		@keyframes mission-button-noise {
			0%, 55%, 100% { opacity: .12; }
			8% { opacity: .12; }
			10% { opacity: .65; transform: translateX(-3px); }
			12% { opacity: .18; }
			14% { opacity: .72; transform: translateX(0); }
			17% { opacity: .05; }
			20% { opacity: .12; transform: translateX(2px); }
			57% { opacity: .22; }
			58% { opacity: .7; }
			59% { opacity: .2; }
			60% { opacity: .75; }
			62% { opacity: .12; }
		}

		.chance-text {
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			z-index: 10;
			color: #fff;
			font-size: 28px;
			font-weight: 900;
			text-shadow: 0 2px 4px #000, 0 0 8px #000;
			pointer-events: none;
		}

		.arrow-orbit {
			position: absolute;
			left: 50%;
			top: 50%;
			width: 280px;
			height: 280px;
			transform: translate(-50%, -50%);
			z-index: 8;
			pointer-events: none;
		}

		.arrow {
			position: absolute;
			left: 50%;
			top: 0;
			width: 28px;
			height: 28px;
			transform: translate3d(-50%, 0, 0) rotate(0deg);
			transform-origin: 50% 140px;
			color: #ffffff;
			opacity: 1;
			filter: brightness(1.45) drop-shadow(0 2px 3px #000) drop-shadow(0 0 5px rgba(255,255,255,.65));
			will-change: transform, filter;
		}

		.arrow svg {
			display: block;
			width: 28px;
			height: 28px;
			color: #ffffff;
			opacity: 1;
			transform: rotate(180deg);
			transform-origin: center center;
		}

		.arrow svg path {
			fill: #ffffff;
		}

		.upgrade-result {
			min-height: 34px;
			margin-top: 8px;
			color: #fff;
			font-size: 22px;
			font-weight: 900;
			letter-spacing: 2px;
			text-shadow: 0 2px 5px #000;
		}

		.upgrade-result.win {
			color: #65e66c;
		}

		.upgrade-result.lose {
			color: #ff4141;
		}

		.chance-selector {
			margin-top: 18px;
			width: 100%;
		}

		.chance-buttons {
			display: flex;
			align-items: stretch;
			width: 100%;
			gap: 7px;
		}

		.chance-btn {
			flex: 1 1 0;
			min-width: 0;
			padding: 9px 12px;
			border: 0;
			border-radius: 4px;
			background: url("img/button.jpg") center / 100% 100% no-repeat;
			color: #17120a;
			font-size: 13px;
			font-weight: 800;
			cursor: pointer;
			text-shadow: 0 1px 1px rgba(255, 224, 115, .55);
			transition: transform 0.1s;
		}

		.chance-btn:hover {
			filter: brightness(1.12);
		}

		.chance-btn:active {
			transform: translateY(1px);
		}

		.chance-btn.active {
			filter: none;
			color: #17120a;
		}

		.chance-btn:not(.active) {
			filter: grayscale(1) brightness(0.75);
		}

		.chance-btn:not(.active):hover {
			filter: grayscale(1) brightness(0.82);
			transform: translateY(-1px);
		}

		.chance-btn:disabled,
		.upgrade-btn:disabled {
			filter: grayscale(1) brightness(0.75);
			opacity: 1;
			color: #050505;
			cursor: not-allowed;
		}

		.upgrade-btn {
			width: 100%;
			margin-top: 16px;
			padding: 15px 20px;
			border: 0;
			border-radius: 4px;
			background: url("img/button.jpg") center / 100% 100% no-repeat;
			color: #17120a;
			font-size: 17px;
			font-weight: 900;
			letter-spacing: 2px;
			text-transform: uppercase;
			cursor: pointer;
			text-shadow: 0 1px 1px rgba(255, 224, 115, .55);
			transition: filter 0.15s, transform 0.1s;
		}

		.upgrade-btn:hover {
			filter: brightness(1.12);
		}

		.upgrade-btn:active {
			transform: translateY(1px);
		}

		.upgrade-btn:disabled {
			filter: grayscale(1) brightness(0.75);
			opacity: 0.4;
			color: #050505;
			cursor: not-allowed;
		}

		.chance-btn:disabled:hover,
		.upgrade-btn:disabled:hover {
			filter: grayscale(1) brightness(0.82);
			transform: translateY(-1px);
		}

		.upgrade-cards {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 8px;
			width: 100%;
			margin-top: 12px;
		}

		.upgrade-card {
			position: relative;
			min-width: 0;
			min-height: 148px;
			overflow: hidden;
			padding: 9px;
			border: 1px solid rgba(149, 161, 169, .42);
			border-radius: 3px;
			background: linear-gradient(180deg, rgba(43, 54, 59, .92), rgba(13, 20, 25, .94));
			box-shadow: inset 0 1px 0 rgba(218, 225, 224, .12), 0 5px 14px rgba(0, 0, 0, .32);
		}

		.upgrade-card::before {
			position: absolute;
			inset: 30px;
			z-index: 0;
			background: url("img/logo.png") center / contain no-repeat;
			filter: grayscale(1) brightness(.55) contrast(.7);
			opacity: .055;
			content: "";
			pointer-events: none;
		}

		.upgrade-card > * {
			position: relative;
			z-index: 1;
		}

		.upgrade-card-label {
			display: block;
			margin-bottom: 7px;
			color: #aeb7bb;
			font-size: 10px;
			font-weight: 700;
			letter-spacing: 1.2px;
			text-align: center;
		}

		.upgrade-item-slot {
			position: relative;
			display: grid;
			place-items: center;
			width: 100%;
			min-height: 108px;
			padding: 8px;
			border: 0;
			border-radius: 0;
			background: transparent;
			color: #8c989d;
			font-size: 10px;
			font-weight: 700;
			letter-spacing: .6px;
			text-align: center;
			cursor: pointer;
		}

		.upgrade-item-slot:hover,
		.upgrade-item-slot[aria-expanded="true"] {
			color: #e9b83f;
			box-shadow: none;
		}

		.upgrade-item-slot img {
			width: 58px;
			height: 58px;
			object-fit: contain;
		}

		.upgrade-item-price {
			position: absolute;
			right: 8px;
			bottom: 8px;
			display: inline-flex;
			align-items: center;
			justify-content: flex-end;
			gap: 4px;
			color: #ffd67a;
			font-size: 9px;
			font-weight: 700;
			letter-spacing: 0.7px;
			line-height: 1.2;
			text-shadow: 0 0 8px rgba(255, 218, 118, 0.4);
		}

		.upgrade-item-price img {
			width: 14px;
			height: 14px;
			object-fit: contain;
			filter: drop-shadow(0 0 4px rgba(255, 214, 110, .45));
		}

		.upgrade-inventory-picker {
			display: block;
			width: 100%;
			max-height: 0;
			margin-top: 0;
			overflow: hidden;
			opacity: 0;
			transition: max-height .35s ease, margin-top .35s ease, opacity .2s ease;
		}

		.upgrade-inventory-picker.is-open {
			max-height: 2000px;
			margin-top: 8px;
			opacity: 1;
			overflow: visible;
		}

		.upgrade-inventory-picker .inventory-grid {
			margin-top: 6px;
		}

		.upgrade-inventory-picker .inventory-slot {
			cursor: pointer;
		}

		.upgrade-inventory-picker .inventory-slot:hover {
			border-color: rgba(255, 196, 59, .7);
		}

		@media (max-width: 430px) {
			.upgrade-wheel {
				width: 360px;
				height: 360px;
			}

			.chance-circle {
				width: 215px;
				height: 215px;
			}

			.arrow-orbit {
				width: 242px;
				height: 242px;
			}

			.arrow {
				width: 25px;
				height: 25px;
				transform-origin: 50% 121px;
			}

			.arrow svg {
				width: 25px;
				height: 25px;
			}

			.upgrade-card {
				padding: 7px;
			}

			.upgrade-item-slot {
				min-height: 96px;
				font-size: 9px;
			}

		}

		@media (pointer: coarse) {
			.chance-gradient,
			.chance-gradient::before {
				animation: none;
			}

			.chance-gradient {
				filter: saturate(1.12) brightness(1.02);
			}
		}
	</style>

	<script>
		const chanceCircle = document.getElementById("chanceCircle");
		const chanceText = document.getElementById("chanceText");
		const arrow = document.getElementById("arrow");
		const upgradeBtn = document.getElementById("upgradeBtn");
		const result = document.getElementById("result");
		const chanceButtons = document.querySelectorAll(".chance-btn");
		const sourceItemSlot = document.getElementById("sourceItemSlot");
		const resultItemSlot = document.getElementById("resultItemSlot");
		const inventoryPicker = document.getElementById("inventoryPicker");
		const inventoryGrid = document.getElementById("inventoryGrid");

		let chance = 50;
		let currentAngle = 0;
		let spinning = false;
		let activeItemSlot = sourceItemSlot;
		let selectedSourceIndex = null;
		let selectedSourceItem = null;
		let suggestedResultItem = null;
		let selectedChancePreset = 50;

		function closeInventoryPicker() {
			inventoryPicker.classList.remove("is-open");
			inventoryPicker.setAttribute("aria-hidden", "true");
			sourceItemSlot.setAttribute("aria-expanded", "false");
			resultItemSlot.setAttribute("aria-expanded", "false");
		}

		function setItemInSlot(slot, item, image, rarity) {
			const price = document.createElement("span");
			price.className = "upgrade-item-price";
			const currency = document.createElement("img");
			currency.src = "img/metro_money.png";
			currency.alt = "Метровалюты";
			price.append(currency);
			const priceValue = document.createElement("span");
			priceValue.textContent = formatCurrencyValue(item.price || 0);
			price.append(priceValue);
			slot.replaceChildren(image.cloneNode(true), rarity.cloneNode(true), price);
			slot.classList.add("has-item");
			slot.setAttribute("aria-label", `Выбран предмет: ${item.name || "предмет"}`);
		}

		function clearSourceItem() {
			const emptyMessage = document.createElement("span");
			emptyMessage.className = "upgrade-item-empty";
			emptyMessage.textContent = "ВЫБРАТЬ ИЗ ИНВЕНТАРЯ";
			sourceItemSlot.replaceChildren(emptyMessage);
			sourceItemSlot.classList.remove("has-item");
			sourceItemSlot.removeAttribute("aria-label");
		}

		function clearResultItem() {
			const emptyMessage = document.createElement("span");
			emptyMessage.className = "upgrade-item-empty";
			emptyMessage.textContent = "ВЫБРАТЬ РЕЗУЛЬТАТ";
			resultItemSlot.replaceChildren(emptyMessage);
			resultItemSlot.classList.remove("has-item");
			resultItemSlot.removeAttribute("aria-label");
			suggestedResultItem = null;
		}

		const getCaseItems = async () => {
			try {
				const state = await window.metroDropSupabase?.load?.();
				const cases = Array.isArray(state?.cases) ? state.cases : [];
				return cases.flatMap((caseItem) => (Array.isArray(caseItem.contents) ? caseItem.contents : []).map((content) => ({
					...content,
					name: content.name || caseItem.name,
					image: content.image || caseItem.image,
					price: Number(content.price ?? caseItem.price ?? 0) || 0,
					rarity: content.rarity || "common"
				})));
			} catch (error) {
				console.error("Failed to load upgrade case items", error);
				return [];
			}
		};

		const findSuggestedUpgradeItem = async (sourceItem) => {
			const currentSource = sourceItem || selectedSourceItem;
			if (!currentSource) {
				return null;
			}

			const sourcePrice = Number(currentSource.price) || 0;
			const candidates = (await getCaseItems()).filter((item) => Number(item.price) > 0);
			if (!candidates.length || !sourcePrice) {
				return null;
			}

			const targetChance = selectedChancePreset === null ? chance : selectedChancePreset;
			const targetPrice = sourcePrice / (targetChance / 100);
			const currentBest = candidates
				.map((item) => ({ ...item, price: Number(item.price) || 0, distance: Math.abs((Number(item.price) || 0) - targetPrice) }))
				.sort((left, right) => left.distance - right.distance)[0] || null;
			const applyAutomaticChance = (candidate) => {
				const automaticChance = Math.min(99.99, Math.max(0.01, (sourcePrice / candidate.price) * 100));
				selectedChancePreset = null;
				chanceButtons.forEach((button) => button.classList.remove("active"));
				if (Math.abs(chance - automaticChance) > 0.005) {
					setChance(automaticChance, { render: false });
				}
			};
			if (!currentBest) {
				return null;
			}

			applyAutomaticChance(currentBest);
			return currentBest;
		};

		const renderSuggestedResult = async () => {
			if (!selectedSourceItem) {
				clearResultItem();
				return;
			}
			const candidate = await findSuggestedUpgradeItem(selectedSourceItem);
			if (!candidate) {
				clearResultItem();
				return;
			}
			suggestedResultItem = candidate;
			const image = document.createElement("img");
			image.className = "inventory-item-image";
			image.src = candidate.image;
			image.alt = candidate.name || "Предмет";
			const rarity = document.createElement("span");
			rarity.className = "inventory-rarity";
			const price = document.createElement("span");
			price.className = "upgrade-item-price";
			const currency = document.createElement("img");
			currency.src = "img/metro_money.png";
			currency.alt = "Метровалюты";
			price.append(currency);
			const priceValue = document.createElement("span");
			priceValue.textContent = formatCurrencyValue(candidate.price || 0);
			price.append(priceValue);
			resultItemSlot.replaceChildren(image, rarity, price);
			resultItemSlot.classList.add("has-item");
			resultItemSlot.setAttribute("aria-label", `Результат апгрейда: ${candidate.name || "предмет"}`);
		};

		async function renderUpgradeInventory() {
			const inventory = await getCurrentPlayerInventory();
			const caseItems = await getCaseItems();
			const rarityClasses = ["rarity-common", "rarity-rare", "rarity-epic", "rarity-blue", "rarity-pink", "rarity-red", "rarity-gold"];
			inventoryGrid.querySelectorAll(".inventory-slot").forEach((slot, index) => {
				const storedItem = inventory[index];
				const catalogItem = storedItem
					? caseItems.find((item) => item.image === storedItem.image && item.name === storedItem.name)
						|| caseItems.find((item) => item.image === storedItem.image)
					: null;
				const item = catalogItem ? { ...storedItem, ...catalogItem } : storedItem;
				slot.replaceChildren();
				slot.classList.toggle("has-item", Boolean(item));
				rarityClasses.forEach((className) => slot.classList.remove(className));
				if (item) slot.classList.add(`rarity-${item.rarity || "common"}`);
				if (!item) return;

				const image = document.createElement("img");
				image.className = "inventory-item-image";
				image.src = item.image;
				image.alt = item.name || "Предмет";
				slot.append(image);
				const rarity = document.createElement("span");
				rarity.className = "inventory-rarity";
				slot.append(rarity);
				slot.onclick = async () => {
					if (activeItemSlot === sourceItemSlot) {
						selectedSourceIndex = index;
						selectedSourceItem = item;
						await renderSuggestedResult();
					}
					setItemInSlot(activeItemSlot, item, image, rarity);
					closeInventoryPicker();
				};
			});
		}

		function openInventoryFor(slot) {
			const isOpen = inventoryPicker.classList.contains("is-open");
			activeItemSlot = slot;
			if (!isOpen) {
				renderUpgradeInventory();
			}
			inventoryPicker.classList.toggle("is-open", !isOpen);
			inventoryPicker.setAttribute("aria-hidden", String(isOpen));
			sourceItemSlot.setAttribute("aria-expanded", String(!isOpen && slot === sourceItemSlot));
			resultItemSlot.setAttribute("aria-expanded", String(!isOpen && slot === resultItemSlot));
		}

		sourceItemSlot.addEventListener("click", () => openInventoryFor(sourceItemSlot));
		resultItemSlot.addEventListener("click", () => openInventoryFor(resultItemSlot));

		function setChance(value, options = {}) {
			chance = Number(value);
			chanceCircle.style.setProperty("--chance", chance + "%");
			const formattedChance = Number.isInteger(chance) ? String(chance) : chance.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
			chanceText.textContent = formattedChance + "%";
			if (selectedSourceItem && options.render !== false) {
				renderSuggestedResult();
			}
		}

		chanceButtons.forEach((button) => {
			button.addEventListener("click", () => {
				if (spinning) return;
				selectedChancePreset = Number(button.dataset.chance);
				chanceButtons.forEach((btn) => btn.classList.remove("active"));
				button.classList.add("active");
				setChance(button.dataset.chance);
				result.textContent = "";
				result.className = "upgrade-result";
			});
		});

		function isInsideChance(angle) {
			const a = ((angle % 360) + 360) % 360;
			const radians = a * Math.PI / 180;
			const y = -Math.cos(radians);
			const boundary = 1 - (chance / 50);
			return y >= boundary;
		}

		function randomAngleInside() {
			let angle;
			do {
				angle = Math.random() * 360;
			} while (!isInsideChance(angle));
			return angle;
		}

		function randomAngleOutside() {
			let angle;
			do {
				angle = Math.random() * 360;
			} while (isInsideChance(angle));
			return angle;
		}

		function getResult() {
			const win = Math.random() * 100 < chance;
			const targetAngle = win ? randomAngleInside() : randomAngleOutside();
			return { win, targetAngle };
		}

		function spinTo(targetAngle) {
			const normalizedCurrent = ((currentAngle % 360) + 360) % 360;
			let delta = targetAngle - normalizedCurrent;
			if (delta < 0) delta += 360;
			const rotations = 5 + Math.floor(Math.random() * 4);
			currentAngle += rotations * 360 + delta;
			arrow.style.willChange = "transform";
			arrow.style.transition = "transform 3.8s cubic-bezier(.12,.72,.15,1)";
			window.requestAnimationFrame(() => {
				arrow.style.transform = `translate3d(-50%, 0, 0) rotate(${currentAngle}deg)`;
			});
		}

		upgradeBtn.addEventListener("click", async () => {
			if (spinning) return;
			if (!selectedSourceItem) {
				result.textContent = "ВЫБЕРИТЕ ПРЕДМЕТ";
				result.className = "upgrade-result lose";
				return;
			}
			spinning = true;
			upgradeBtn.disabled = true;

			const inventory = await getCurrentPlayerInventory();
			const selectedItem = selectedSourceIndex !== null ? inventory[selectedSourceIndex] : null;
			const sourceOutcome = selectedSourceIndex !== null ? inventory.filter((_, index) => index !== selectedSourceIndex) : inventory;
			const resultItem = suggestedResultItem ? { ...suggestedResultItem } : null;
			const { win, targetAngle } = getResult();
			spinTo(targetAngle);

			window.setTimeout(async () => {
				result.textContent = win ? "УСПЕХ" : "НЕУДАЧА";
				result.className = `upgrade-result ${win ? "win" : "lose"}`;
				if (win && resultItem) {
					const nextInventory = [...sourceOutcome, resultItem];
					await persistCurrentPlayerInventory(nextInventory);
					await window.recordMissionProgress?.("upgrades", 1);
					await window.recordPlayerStat?.("upgrades_won", 1);
				} else if (selectedItem) {
					await persistCurrentPlayerInventory(sourceOutcome);
				}
				selectedSourceIndex = null;
				selectedSourceItem = null;
				clearSourceItem();
				clearResultItem();
				spinning = false;
				upgradeBtn.disabled = false;
			}, 3900);
		});

		setChance(50);
		clearResultItem();
	</script>
</body>
