<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Контракт | MetroDrop</title>
	<link rel="stylesheet" href="style.css">
	<link rel="preload" as="image" href="img/contract_backround.jpg">
	<script src="supabase.js"></script>
	<script src="script.js" defer></script>
</head>
<body class="contract-body">
	<div class="background-overlay" aria-hidden="true"></div>

	<header class="site-header">
		<a class="brand" href="home.html" aria-label="MetroDrop - главная">
			<img class="brand-logo" src="img/logo.png" alt="MetroDrop">
		</a>
		<nav class="main-nav" id="main-menu" aria-label="Основная навигация">
			<a class="nav-link" href="home.html#login">АВТОРИЗАЦИЯ</a>
			<a class="nav-link" href="home.html#cases">КЕЙСЫ</a>
			<a class="nav-link" href="home.html#market">РЫНОК</a>
			<a class="nav-link" href="workbench.html">ВЕРСТАК</a>
			<a class="nav-link is-active" href="contract.html">КОНТРАКТ</a>
			<div class="mobile-menu-panel" aria-label="Меню пользователя">
				<a class="mobile-menu-item" href="home.html#login">АВТОРИЗАЦИЯ</a>
				<a class="mobile-menu-item" href="home.html#cases">КЕЙСЫ</a>
				<a class="mobile-menu-item" href="workbench.html">ВЕРСТАК</a>
				<a class="mobile-menu-item" href="upgrade.html">АПГРЕЙД</a>
				<a class="mobile-menu-item" href="contract.html">КОНТРАКТ</a>
				<a class="mobile-menu-item gold-menu-item" href="missions.html">СОБЫТИЯ</a>
				<img class="mobile-menu-decoration" src="img/img_menu.png" alt="" aria-hidden="true">
			</div>
		</nav>
		<div class="header-actions">
			<div class="balance-card" data-balance-card role="button" tabindex="0" aria-label="Переключить валюту">
				<span class="balance" data-balance>0</span>
				<img class="balance-currency" data-balance-currency src="img/metro_money.png" alt="Метровалюты">
			</div>
			<a class="login-button" href="home.html#login">ВОЙТИ</a>
			<button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu">
				<span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
				<span class="visually-hidden">Открыть меню</span>
			</button>
		</div>
	</header>

	<main class="contract-page" aria-label="Страница контракта">
		<section class="contract-board" aria-label="Выбор предмета контракта">
			<div class="contract-orbit" aria-hidden="true">
				<img class="contract-circle" src="img/circle_contarct.png" alt="">
				<img class="contract-logo" src="img/logo.png" alt="MetroDrop">
				<img class="contract-reward" src="" alt="" hidden>
				<div class="contract-cards">
					<button class="contract-card" type="button" style="--card-angle: 0deg" aria-label="Предмет контракта 1"></button>
					<button class="contract-card" type="button" style="--card-angle: 36deg" aria-label="Предмет контракта 2"></button>
					<button class="contract-card" type="button" style="--card-angle: 72deg" aria-label="Предмет контракта 3"></button>
					<button class="contract-card" type="button" style="--card-angle: 108deg" aria-label="Предмет контракта 4"></button>
					<button class="contract-card" type="button" style="--card-angle: 144deg" aria-label="Предмет контракта 5"></button>
					<button class="contract-card" type="button" style="--card-angle: 180deg" aria-label="Предмет контракта 6"></button>
					<button class="contract-card" type="button" style="--card-angle: 216deg" aria-label="Предмет контракта 7"></button>
					<button class="contract-card" type="button" style="--card-angle: 252deg" aria-label="Предмет контракта 8"></button>
					<button class="contract-card" type="button" style="--card-angle: 288deg" aria-label="Предмет контракта 9"></button>
					<button class="contract-card" type="button" style="--card-angle: 324deg" aria-label="Предмет контракта 10"></button>
				</div>
			</div>
		</section>

		<div class="contract-submit-wrap">
			<button id="contractSubmitButton" class="button_long contract-submit-button" type="button" disabled aria-disabled="true">
				КОНТРАКТ
			</button>

			<section class="inventory contract-inventory-picker" id="contractInventoryPicker" aria-label="Инвентарь" aria-hidden="true">
				<div class="inventory-header" aria-hidden="true">
					<img src="img/head_inventory.jpg" alt="">
					<span>ИНВЕНТАРЬ</span>
				</div>
				<div class="inventory-grid" id="contractInventoryGrid">
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
					<div class="inventory-slot"></div>
				</div>
			</section>
		</div>
	</main>
</body>
</html>
